<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A Notion-inspired Minesweeper built with Vite, React and TypeScript — three difficulties, custom boards, flags, chording, keyboard play and saved records."
    />
    <title>Minesweeper · A calmer classic</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var stored = localStorage.getItem('minesweeper.theme.v1')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
